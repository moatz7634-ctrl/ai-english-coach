<script>
// ══════════════════════════════════════
// GEMINI API CONFIGURATION (DIRECT & DYNAMIC)
// ══════════════════════════════════════
function getApiKey() {
  var inputVal = document.getElementById('user-api-key').value.trim();
  var stored = localStorage.getItem('user_gemini_key');
  if(inputVal) {
    localStorage.setItem('user_gemini_key', inputVal);
    return inputVal;
  }
  return stored || '';
}

window.addEventListener('DOMContentLoaded', function() {
  var savedKey = localStorage.getItem('user_gemini_key');
  if(savedKey) {
    document.getElementById('user-api-key').value = savedKey;
  }
});

async function callGemini(system, messages) {
  var key = getApiKey();
  if(!key) {
    showErr("يرجى إدخال Gemini API Key أولاً للدردشة التفاعلية!");
    return null;
  }
  
  try {
    var contents = [];
    messages.forEach(function(m){
      if(m.content && m.content !== '[start]') {
        contents.push({
          role: m.role === 'assistant' ? 'model' : 'user',
          parts: [{ text: m.content }]
        });
      }
    });

    var res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: {
          parts: [{ text: system }]
        },
        contents: contents,
        generationConfig: {
          maxOutputTokens: 150,
          temperature: 0.7
        }
      })
    });

    var data = await res.json();
    if (data.error) {
      showErr("خطأ في المفتاح: " + data.error.message);
      return null;
    }
    if (data.candidates && data.candidates[0].content.parts[0].text) {
      return data.candidates[0].content.parts[0].text.trim();
    }
    return null;
  } catch(e) {
    console.error('Gemini API Error:', e);
    showErr("فشل الاتصال بالذكاء الاصطناعي، تحقق من الإنترنت والـ Key.");
    return null;
  }
}

// ══════════════════════════════════════
// GRAMMAR RULES
// ══════════════════════════════════════
var GRAM = [
  {p:/\bare you hear\b/i, orig:"are you hear", fix:"can you hear me", why:"استخدم 'can' مع 'hear' — مش 'are'"},
  {p:/\bi am hear\b/i, orig:"I am hear", fix:"I can hear you", why:"'hear' فعل حالة — مش بيجي بعد 'am'"},
  {p:/\bi am agree\b/i, orig:"I am agree", fix:"I agree", why:"'agree' بييجي بدون 'am'"},
  {p:/\bi am understand\b/i, orig:"I am understand", fix:"I understand", why:"'understand' فعل حالة — بدون 'am'"},
  {p:/\bi am know\b/i, orig:"I am know", fix:"I know", why:"'know' فعل حالة — بدون 'am'"},
  {p:/\bi working\b/i, orig:"I working", fix:"I am working", why:"محتاج 'am' قبل الفعل المستمر"},
  {p:/\bhe dont\b/i, orig:"he dont", fix:"he doesn't", why:"مع he/she/it لازم 'doesn't'"},
  {p:/\bshe dont\b/i, orig:"she dont", fix:"she doesn't", why:"مع he/she/it لازم 'doesn't'"},
  {p:/\bwe was\b/i, orig:"we was", fix:"we were", why:"مع we/they الماضي 'were' مش 'was'"},
  {p:/\bthey was\b/i, orig:"they was", fix:"they were", why:"مع we/they الماضي 'were' مش 'was'"},
  {p:/\bmore better\b/i, orig:"more better", fix:"better", why:"'better' مقارنة بالفعل — مش محتاج 'more'"},
  {p:/\bmore easier\b/i, orig:"more easier", fix:"easier", why:"'easier' مقارنة — مش محتاج 'more'"},
  {p:/\bmore faster\b/i, orig:"more faster", fix:"faster", why:"'faster' مقارنة — مش محتاج 'more'"},
  {p:/\bi have (\d+) year/i, orig:"I have X years experience", fix:"I have X years of experience", why:"لازم 'of' بعد years"},
  {p:/\bi working in here\b/i, orig:"I working in here", fix:"I work here", why:"'I work here' بدون 'in' وبدون 'ing'"},
  {p:/\bsince (\d+) year/i, orig:"since X years", fix:"for X years", why:"مع فترة زمنية استخدم 'for' مش 'since'"},
  {p:/\bopen my mind\b/i, orig:"open my mind", fix:"broaden my horizons", why:"التعبير الصح 'broaden my horizons'"},
  {p:/\bit make me\b/i, orig:"it make me", fix:"it makes me", why:"مع 'it' لازم 'makes' مش 'make'"},
  {p:/\bvery much better\b/i, orig:"very much better", fix:"much better", why:"'much better' بس — بدون 'very'"},
  {p:/\byesterday i (go|come|see|do|eat|have)\b/i, orig:"yesterday I go/come/see", fix:"yesterday I went/came/saw", why:"بعد yesterday لازم الماضي البسيط"},
  {p:/\bi buyed\b/i, orig:"I buyed", fix:"I bought", why:"'buy' ماضيها 'bought' مش 'buyed'"},
  {p:/\bi goed\b/i, orig:"I goed", fix:"I went", why:"'go' ماضيها 'went' مش 'goed'"},
  {p:/\bi taked\b/i, orig:"I taked", fix:"I took", why:"'take' ماضيها 'took' مش 'taked'"},
  {p:/\bI am \d+ years\b/i, orig:"I am X years", fix:"I am X years old", why:"محتاج 'old' في الآخر"},
  {p:/\bpeople is\b/i, orig:"people is", fix:"people are", why:"'people' جمع — استخدم 'are' مش 'is'"},
  {p:/\binformations\b/i, orig:"informations", fix:"information", why:"'information' لا تجمع — مش بيجيها 's'"},
  {p:/\badvices\b/i, orig:"advices", fix:"advice", why:"'advice' لا تجمع — مش بيجيها 's'"},
  {p:/\bknowledges\b/i, orig:"knowledges", fix:"knowledge", why:"'knowledge' لا تجمع"},
  {p:/\bfurnitures\b/i, orig:"furnitures", fix:"furniture", why:"'furniture' لا تجمع"},
  {p:/\bhe have\b/i, orig:"he have", fix:"he has", why:"مع he/she/it استخدم 'has' مش 'have'"},
  {p:/\bshe have\b/i, orig:"she have", fix:"she has", why:"مع he/she/it استخدم 'has' مش 'have'"},
  {p:/\bit have\b/i, orig:"it have", fix:"it has", why:"مع he/she/it استخدم 'has' مش 'have'"},
];

var WEAK = [
  {p:/\bit is good\b/i, said:"it is good", better:"it is effective / beneficial"},
  {p:/\bvery good\b/i, said:"very good", better:"excellent / outstanding"},
  {p:/\bvery bad\b/i, said:"very bad", better:"terrible / critical / severe"},
  {p:/\bbig problem\b/i, said:"big problem", better:"major issue / critical challenge"},
  {p:/\ba lot of\b/i, said:"a lot of", better:"numerous / significant / substantial"},
  {p:/\bnice\b/i, said:"nice", better:"impressive / remarkable / pleasant"},
];

function checkGram(text) {
  var errs=[];
  GRAM.forEach(function(r){ if(r.p.test(text)) errs.push({orig:r.orig,fix:r.fix,why:r.why}); });
  return errs;
}
function checkWeak(text) {
  var w=[];
  WEAK.forEach(function(r){ if(r.p.test(text)) w.push({said:r.said,better:r.better}); });
  return w;
}
function scoreIt(errs, wc, fillers, text) {
  var s = 10;
  s -= Math.min(6, errs.length * 2);
  s -= fillers > 3 ? 2 : fillers > 1 ? 1 : 0;
  s -= wc < 5 ? 3 : wc < 8 ? 1 : 0;
  if (text) {
    var t = text.toLowerCase();
    var hasVerb = /\b(is|are|was|were|am|have|has|had|do|does|did|will|would|can|could|should|may|might|must|been|be|being|work|works|worked|go|goes|went|know|knew|want|think|feel|need|get|make|take|see|come|say|said|tell|told|use|used|find|give|gave|try|tried|help|helped|like|liked|look|looked|seem|seemed|become|became|leave|left|put|mean|keep|let|begin|show|hear|play|run|move|live|believe|hold|bring|happen|write|provide|stand|lose|pay|meet|include|continue|set|learn|change|lead|understand|watch|follow|stop|create|speak|read|spend|grow|open|walk|win|offer|remember|love|consider|appear|buy|wait|serve|die|send|expect|build|stay|fall|cut|reach|kill|remain|suggest|raise|pass|sell|require|report|decide|pull)\b/.test(t);
    if (!hasVerb && wc > 3) s -= 2;
    if (/\bi (my|the|a|an)\b/.test(t) && !/\b(and|but|or|because|so|when|if|that|who|which)\b/.test(t) && wc < 6) s -= 1;
    var words = t.split(/\s+/);
    for (var i = 0; i < words.length - 1; i++) {
      if (words[i] === words[i+1] && words[i].length > 2) { s -= 1; break; }
    }
    if (text[0] && text[0] === text[0].toLowerCase() && wc > 5) s -= 0.5;
    if (wc > 25 && !/[.!?,;]/.test(text)) s -= 1;
    if (/\bi am [a-z]/.test(t) && !/\bi am (a|an|the|not|very|so|really|quite|going|trying|working|looking)\b/.test(t)) s -= 1;
    if (/\byesterday\b/.test(t) && /\b(go|come|see|do|eat|have|take|make|give|get|know|think|feel|want|say|tell)\b/.test(t) && !/\b(went|came|saw|did|ate|had|took|made|gave|got|knew|thought|felt|wanted|said|told)\b/.test(t)) s -= 2;
  }
  return Math.max(1, Math.min(10, Math.round(s * 10) / 10));
}

  {ar:"محتاج تبلغ المدير لو في مشكلة.", hint:"Modal — need to + infinitive", en:"You need to notify the manager if there is a problem."},
];
var gramIdx = 0;

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
var state = {
  scenario:'presentation', messages:[], analyses:[], gramResults:[],
  allErrors:[], allWeak:[],
  micOn:false, aiSpeak:false, camOn:false,
  stream:null, recog:null, finalTxt:'',
  timer:0, timerIv:null, waveRef:null,
  turnCount:0, sessionActive:false
};

function pickSc(el) {
  document.querySelectorAll('.sc-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  state.scenario = el.dataset.id;
}

async function startSession() {
  var key = getApiKey();
  if(!key) {
    alert("برجاء إدخال Gemini API Key أولاً في الشاشة الرئيسية!");
    return;
  }

  document.getElementById('stitle').textContent = sc.name;

  document.getElementById('av-circle').style.borderColor = 'rgba(255,255,255,0.1)';
  try {
    var stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    state.stream=stream; state.camOn=true;

// ══════════════════════════════════════
// SPEECH RECOGNITION
// ══════════════════════════════════════
function initRecog() {
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showErr('Need Chrome or Edge.');return;}
  var r=new SR();
  r.lang='en-US';r.continuous=true;r.interimResults=true;
  r.onresult=function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) state.finalTxt+=e.results[i][0].transcript+' ';
      else interim+=e.results[i][0].transcript;
    }
    var show=(state.finalTxt+interim).trim();
    var lt=document.getElementById('live');
    lt.style.display=show?'block':'none';
    lt.textContent='🎤 '+show;
  };
  r.onend=function(){if(r._active){try{r.start();}catch(e){}}};
  r.onerror=function(e){if(e.error!=='no-speech')showErr('Mic: '+e.error);};
  state.recog=r;
}

function toggleMic(){if(state.micOn)stopMic();else startMic();}
function startMic(){
  if(state.aiSpeak){window.speechSynthesis&&window.speechSynthesis.cancel();setAiSpeak(false);}
  state.finalTxt='';
  var lt=document.getElementById('live');lt.style.display='none';lt.textContent='';
  var r=state.recog;if(!r){showErr('Not available.');return;}
  r._active=true;try{r.start();}catch(e){}
  state.micOn=true;
  document.getElementById('mic-btn').classList.add('rec');
  document.getElementById('mic-icon').className='ti ti-player-stop';
  document.getElementById('mic-lbl').textContent='Stop';
}
function stopMic(){
  var r=state.recog;
  if(r){r._active=false;try{r.stop();}catch(e){}}
  state.micOn=false;
  document.getElementById('mic-btn').classList.remove('rec');
  document.getElementById('mic-icon').className='ti ti-microphone';
  document.getElementById('mic-lbl').textContent='Speak';
  document.getElementById('live').style.display='none';
  var txt=state.finalTxt.trim();
  if(txt.length<2)return;
  if(state.scenario==='grammar'){
    processGramAnswer(txt);
  } else {
    processConvAnswer(txt);
  }
}

// ══════════════════════════════════════
// CONVERSATION MODE
// ══════════════════════════════════════
function processConvAnswer(txt){
  var errs=checkGram(txt);
  var weak=checkWeak(txt);
  var words=txt.trim().split(/\s+/).filter(Boolean);
  var wc=words.length;
  var fillers=(txt.match(/\b(um|uh|like|you know|basically|literally|i mean|so so|kind of)\b/gi)||[]);
  var score=scoreIt(errs,wc,fillers.length,txt);
  var better=txt;
  errs.forEach(function(e){better=better.replace(new RegExp(e.orig.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),e.fix);});
  var analysis={text:txt,errs:errs,weak:weak,wc:wc,fillers:fillers,score:score,better:better};
  state.analyses.push(analysis);
  errs.forEach(function(e){state.allErrors.push(e);});
  weak.forEach(function(w){state.allWeak.push(w);});
  addAnalysisCard(analysis);
  addMsg('user',txt);
  setTimeout(function(){buildConvReply(analysis);},200);
}

async function buildConvReply(analysis){
  var sc=SCENARIOS[state.scenario];
  state.turnCount++;
  showTyping();
  
  var history=[];
  state.messages.forEach(function(m){
    history.push({role:m.role==='ai'?'assistant':'user',content:m.text});
  });
  if(!history.length||history[0].role!=='user') history.unshift({role:'user',content:'[start]'});
  
  var sysPrompt='You are '+sc.avatarName+', '+sc.avatarRole+'. You are having a realistic, intelligent English conversation with a student. '+
    'STRICT INSTRUCTIONS: 1) Listen carefully to what the student just said and RESPOND DIRECTLY to their message content. 2) Never repeat scripted or generic questions. 3) Keep your response SHORT (1-2 clear sentences). 4) End with 1 relevant follow-up question based on their statement. 5) Be polite, smart, and interactive.';
  
  var aiText = await callGemini(sysPrompt, history);
  hideTyping();
  if(!aiText){
    aiText = "That's interesting! Could you tell me more about what you mean by that?";
  }
  addMsg('ai',aiText);
  speakText(aiText);
}

// ══════════════════════════════════════
// GRAMMAR TRAINER MODE
// ══════════════════════════════════════
function showGramChallenge(){
  if(gramIdx>=GRAM_CHALLENGES.length) gramIdx=0;
  var ch=GRAM_CHALLENGES[gramIdx];
  document.getElementById('gram-ar').textContent=ch.ar;
  document.getElementById('gram-hint').textContent='💡 '+ch.hint;
}

function nextGramChallenge(){
  gramIdx++;
  if(gramIdx>=GRAM_CHALLENGES.length) gramIdx=0;
  showGramChallenge();
}

function processGramAnswer(txt){
  var ch=GRAM_CHALLENGES[gramIdx];
  var errs=checkGram(txt);
  var words=txt.trim().split(/\s+/).filter(Boolean);
  var wc=words.length;
  var expected=ch.en.toLowerCase().replace(/[^a-z\s]/g,'').trim();
  var said=txt.toLowerCase().replace(/[^a-z\s]/g,'').trim();
  var saidWords=said.split(/\s+/);
  var expWords=expected.split(/\s+/);
  var matched=0;
  expWords.forEach(function(w){if(saidWords.indexOf(w)!==-1)matched++;});
  var similarity=Math.round((matched/expWords.length)*100);
  var correct=similarity>=70&&errs.length===0;
  var result={
    ar:ch.ar, hint:ch.hint,
    said:txt, expected:ch.en,
    errs:errs, similarity:similarity,
    correct:correct
  };
  state.gramResults.push(result);
  if(errs.length>0) errs.forEach(function(e){state.allErrors.push(e);});
  addGramAnalysisCard(result);
  addMsg('user',txt);
  var reply='';
  if(correct&&errs.length===0){
    var praise=["Perfect!", "Excellent!", "That's correct!", "Well done!","Spot on!"];
    reply=praise[state.turnCount%praise.length]+' The correct answer is: "'+ch.en+'" — you got it right! Ready for the next one?';
  } else {
    reply='Not quite. The correct sentence is: "'+ch.en+'"';
    if(errs.length>0) reply+=' — '+errs[0].why;
    reply+=' Try the next one!';
  }
  state.turnCount++;
  showTyping();
  setTimeout(function(){
    hideTyping();
    addMsg('ai',reply);
    speakText(reply);
    setTimeout(function(){
      gramIdx++;
      if(gramIdx>=GRAM_CHALLENGES.length) gramIdx=0;
      showGramChallenge();
    },2000);
  },500);
}

// ══════════════════════════════════════
// ANALYSIS CARDS
// ══════════════════════════════════════
function addAnalysisCard(a){
  var panel=document.getElementById('analysis-panel');
  document.getElementById('analysis-empty').style.display='none';
  var sc=a.score>=8?'g':a.score>=5?'w':'r';
  var card=document.createElement('div');card.className='ana-card';
  var html='<div class="ana-header"><span class="ana-turn">Turn '+state.analyses.length+'</span><span class="ana-score '+sc+'">'+a.score+'/10</span></div>';
  html+='<div class="ana-said">'+escHtml(a.text)+'</div>';
  if(a.errs.length===0&&a.weak.length===0&&a.fillers.length<2&&a.score>=8){
    html+='<div class="ana-ok">✓ الجملة صح — مفيش أخطاء واضحة!</div>';
    if(a.wc<8) html+='<div class="filler-row">⚠ الجملة قصيرة ('+a.wc+' كلمات). حاول تكمّل الفكرة.</div>';
  } else if(a.errs.length===0&&a.score<8){
    html+='<div class="filler-row" style="color:var(--amber);">⚠ Score: '+a.score+'/10 — في مشاكل في هيكل الجملة حتى لو مفيش خطأ واضح. راجع التفاصيل:</div>';
    var t=a.text.toLowerCase();
    if(a.wc<8) html+='<div class="err-row"><div class="err-orig">الجملة قصيرة جداً ('+a.wc+' كلمات)</div><div class="err-fix">اكمل الفكرة — هدفك 15+ كلمة</div></div>';
    if(a.fillers.length>1) html+='<div class="err-row"><div class="err-orig">Filler words: '+a.fillers.join(", ")+'</div><div class="err-fix">وقف بهدوء بدلهم</div></div>';
    if(/yesterday/.test(t)&&!/went|came|saw|did|ate|had|took|made/.test(t)) html+='<div class="err-row"><div class="err-orig">استخدمت "yesterday" مع فعل مضارع</div><div class="err-fix">بعد yesterday لازم الماضي البسيط</div></div>';
    if(a.wc>25&&!/[.!?,]/.test(a.text)) html+='<div class="err-row"><div class="err-orig">جملة طويلة بدون علامات ترقيم</div><div class="err-fix">قسّم الجملة بفاصلة أو نقطة</div></div>';
  } else {
    a.errs.forEach(function(e){
      html+='<div class="err-row">';
      html+='<div class="err-orig">✗ "'+escHtml(e.orig)+'"</div>';
      html+='<div class="err-fix">✓ "'+escHtml(e.fix)+'"</div>';
      html+='<div class="err-why">'+escHtml(e.why)+'</div></div>';
    });
    a.weak.forEach(function(w){
      html+='<div class="weak-row"><div style="font-size:12px;color:var(--amber);">⚠ "'+escHtml(w.said)+'" — أضعف</div><div style="font-size:12px;color:#8b93ad;">الأفضل: "'+escHtml(w.better)+'"</div></div>';
    });
    if(a.fillers.length>1){
      html+='<div class="filler-row">⚠ استخدمت '+a.fillers.length+' filler words: '+a.fillers.join(', ')+'</div>';
    }
    if(a.wc<8){
      html+='<div class="filler-row">⚠ الجملة قصيرة ('+a.wc+' كلمات) — حاول تكمل الفكرة.</div>';
    }
    if(a.errs.length>0&&a.better!==a.text){
      html+='<div class="better-box"><div class="better-label">الجملة الصح:</div><div class="better-text">'+escHtml(a.better)+'</div></div>';
    }
  }
  card.innerHTML=html;
  panel.insertBefore(card,panel.firstChild);
}

async function aiGreet(){
  var sc=SCENARIOS[state.scenario];
  showTyping();
  if(state.scenario==='grammar'){
    hideTyping();
    var opener=sc.openers[Math.floor(Math.random()*sc.openers.length)];
    addMsg('ai',opener);speakText(opener);
    return;
  }
  var sysPrompt='You are '+sc.avatarName+', '+sc.avatarRole+'. Give a warm, natural opening greeting and your first question to start the session. Keep it to 2 sentences max. Be direct and friendly.';
  var text = await callGemini(sysPrompt,[{role:'user',content:'Start the session now.'}]);
  hideTyping();
  if(!text) text=sc.openers[Math.floor(Math.random()*sc.openers.length)];
  addMsg('ai',text);speakText(text);
}

// ══════════════════════════════════════
// TTS
// ══════════════════════════════════════
function speakText(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  setAiSpeak(true);
  var chunks=text.match(/[^.!?]+[.!?]*/g)||[text];
  var i=0;
  function next(){
    if(i>=chunks.length){setAiSpeak(false);return;}
    var c=chunks[i].trim();if(!c){i++;next();return;}
    var u=new SpeechSynthesisUtterance(c);
    u.lang='en-US';u.rate=0.92;
    var vs=window.speechSynthesis.getVoices().filter(function(v){return v.lang.startsWith('en');});
    if(vs.length)u.voice=vs[0];
    u.onend=function(){i++;setTimeout(next,70);};
    u.onerror=function(){i++;setTimeout(next,70);};
    window.speechSynthesis.speak(u);
  }
  next();
  if(!window._ka){window._ka=setInterval(function(){
    if(state.aiSpeak&&window.speechSynthesis.paused)window.speechSynthesis.resume();
    if(!state.aiSpeak){clearInterval(window._ka);window._ka=null;}
  },8000);}
}

function setAiSpeak(val){
  state.aiSpeak=val;
  var sc=SCENARIOS[state.scenario];
  var circle=document.getElementById('av-circle');
  if(val){
    circle.style.borderColor=sc.color;
    circle.style.boxShadow='0 0 20px '+sc.color+'50';
    state.waveRef=setInterval(function(){
      var h=[4,7,14,10,5,12,8,4,16,6];
      document.querySelectorAll('.wave').forEach(function(w){w.style.height=h[Math.floor(Math.random()*h.length)]+'px';});
    },110);
  } else {
    circle.style.borderColor='rgba(255,255,255,0.1)';
    circle.style.boxShadow='none';
    clearInterval(state.waveRef);
    document.querySelectorAll('.wave').forEach(function(w){w.style.height='4px';});
  }
}

function addMsg(role,text){
  state.messages.push({role,text,ts:Date.now()});
  var sc=SCENARIOS[state.scenario];
  var panel=document.getElementById('chat-panel');
  document.getElementById('chat-empty').style.display='none';
  var div=document.createElement('div');div.className='msg '+role;
  div.innerHTML='<div class="msg-lbl">'+(role==='ai'?sc.avatarName:'You')+'</div><div>'+escHtml(text)+'</div>';
  panel.appendChild(div);panel.scrollTop=panel.scrollHeight;

}
function showBubble(text){
  var b=document.getElementById('bubble');
  b.textContent=text.slice(0,130)+(text.length>130?'...':'');
  b.style.display='block';
  setTimeout(function(){b.style.display='none';},Math.max(4000,text.length*55));
}
function showTyping(){
  var p=document.getElementById('chat-panel');
  var t=document.createElement('div');t.id='typing';t.className='typing-ind';
  t.innerHTML='<span></span><span></span><span></span>';

}
function hideTyping(){var t=document.getElementById('typing');if(t)t.remove();}

function endSession(){
  clearInterval(state.timerIv);
  window.speechSynthesis&&window.speechSynthesis.cancel();
  if(state.recog){state.recog._active=false;try{state.recog.stop();}catch(e){}}
  if(state.stream)state.stream.getTracks().forEach(function(t){t.stop();});
  setAiSpeak(false);state.sessionActive=false;
  document.getElementById('sdot').style.background='#4b5268';
  document.getElementById('sdot').style.boxShadow='none';
  generateReport();
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.tab')[2].classList.add('active');
  switchTab('report',document.querySelectorAll('.tab')[2]);
}

function generateReport(){
  var isGram=state.scenario==='grammar';
  document.getElementById('rep-empty').style.display='none';
  var rc=document.getElementById('rep-content');rc.style.display='block';
  var m=Math.floor(state.timer/60),s=state.timer%60;
  var dur=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');

  if(isGram){
    var total=state.gramResults.length;
    var correct=state.gramResults.filter(function(r){return r.correct;}).length;
    var pct=total>0?Math.round((correct/total)*100):0;
    var scoreCol=pct>=80?'g':pct>=50?'w':'r';
    var html='<div class="sc-circle"><span class="sc-n">'+pct+'</span><span class="sc-of">%</span></div>';
    html+='<div class="rtitle">Grammar Trainer Results</div>';
    html+='<div class="metric"><span style="color:#8b93ad">Duration</span><span class="mv">'+dur+'</span></div>';
    html+='<div class="metric"><span style="color:#8b93ad">Total Questions</span><span class="mv">'+total+'</span></div>';
    html+='<div class="metric"><span style="color:#8b93ad">Correct</span><span class="mv g">'+correct+'</span></div>';
    html+='<div class="metric"><span style="color:#8b93ad">Wrong</span><span class="mv r">'+(total-correct)+'</span></div>';
    html+='<div class="metric"><span style="color:#8b93ad">Score</span><span class="mv '+scoreCol+'">'+pct+'%</span></div>';

    var wrong=state.gramResults.filter(function(r){return !r.correct;});
    if(wrong.length>0){
      html+='<div class="rtitle">الجمل اللي غلطت فيها</div>';
      wrong.forEach(function(r){
        html+='<div class="rep-err-block">';
        html+='<div style="font-size:12px;color:#8b93ad;direction:rtl;text-align:right;margin-bottom:4px;">'+escHtml(r.ar)+'</div>';
        html+='<div class="rep-err-orig">قلت: "'+escHtml(r.said)+'"</div>';
        html+='<div class="rep-err-fix">الصح: "'+escHtml(r.expected)+'"</div>';
        if(r.errs.length>0)html+='<div class="rep-err-why">'+escHtml(r.errs[0].why)+'</div>';
        html+='</div>';
      });
    }
    if(pct<60){html+='<div class="rep-item bad">✗ محتاج تراجع القواعد الأساسية أكتر. ركز على الأخطاء اللي فوق.</div>';}
    else if(pct<80){html+='<div class="rep-item warn">⚠ مستوى متوسط. راجع الجمل الغلط وجرب تاني.</div>';}
    else{html+='<div class="rep-item ok">✓ ممتاز! Grammar بتاعك قوي.</div>';}
    html+='<button class="new-btn" onclick="location.reload()">New Session</button>';
    rc.innerHTML=html;
    return;
  }

  var a=state.analyses;
  var turns=a.length;
  if(!turns){rc.innerHTML='<div class="empty"><div class="empty-icon">💬</div><p>مفيش بيانات كافية.</p></div>';return;}
  var totalWords=a.reduce(function(s,d){return s+d.wc;},0);
  var totalFillers=a.reduce(function(s,d){return s+d.fillers.length;},0);
  var avgScore=(a.reduce(function(s,d){return s+d.score;},0)/turns).toFixed(1);
  var totalErrs=state.allErrors.length;
  var avgWords=Math.round(totalWords/turns);
  var sc=parseFloat(avgScore)>=8?'g':parseFloat(avgScore)>=5?'w':'r';

  var html='<div class="sc-circle"><span class="sc-n">'+parseFloat(avgScore).toFixed(1)+'</span><span class="sc-of">/10</span></div>';
  html+='<div class="rtitle">Session Stats</div>';
  html+='<div class="metric"><span style="color:#8b93ad">Duration</span><span class="mv">'+dur+'</span></div>';
  html+='<div class="metric"><span style="color:#8b93ad">Turns</span><span class="mv">'+turns+'</span></div>';
  html+='<div class="metric"><span style="color:#8b93ad">Total Words</span><span class="mv">'+totalWords+'</span></div>';
  html+='<div class="metric"><span style="color:#8b93ad">Avg Words/Turn</span><span class="mv '+(avgWords>=15?'g':avgWords>=10?'w':'r')+'">'+avgWords+'</span></div>';
  html+='<div class="metric"><span style="color:#8b93ad">Grammar Errors</span><span class="mv '+(totalErrs===0?'g':totalErrs<=3?'w':'r')+'">'+totalErrs+'</span></div>';
  html+='<div class="metric"><span style="color:#8b93ad">Filler Words</span><span class="mv '+(totalFillers<=2?'g':totalFillers<=5?'w':'r')+'">'+totalFillers+'</span></div>';

  html+='<div class="rtitle">الحكم على أدائك</div>';
  if(totalErrs===0){html+='<div class="rep-item ok">✓ ممتاز! مفيش أخطاء grammar.</div>';}
  else if(totalErrs<=3){html+='<div class="rep-item warn">⚠ '+totalErrs+' أخطاء grammar — راجعهم تحت.</div>';}
  else{html+='<div class="rep-item bad">✗ '+totalErrs+' أخطاء grammar — محتاج تتدرب أكتر على القواعد.</div>';}

  if(avgWords<10){html+='<div class="rep-item bad">✗ متوسط كلامك قصير جداً ('+avgWords+' كلمة). الطبيعي 15-25 كلمة.</div>';}
  else if(avgWords<15){html+='<div class="rep-item warn">⚠ متوسط كلامك '+avgWords+' كلمة — كويس بس ممكن تزود.</div>';}
  else{html+='<div class="rep-item ok">✓ متوسط كلامك '+avgWords+' كلمة — ممتاز!</div>';}

  if(totalFillers>5){html+='<div class="rep-item bad">✗ '+totalFillers+' filler words — بيضعف الانطباع. لما تحس بـ um، وقف بدلاً منها.</div>';}
  else if(totalFillers>2){html+='<div class="rep-item warn">⚠ '+totalFillers+' filler words — حاول تقللهم.</div>';}
  else{html+='<div class="rep-item ok">✓ Filler words قليلة — كويس!</div>';}

  var uniq=[];
  state.allErrors.forEach(function(e){if(!uniq.find(function(u){return u.orig===e.orig;}))uniq.push(e);});
  if(uniq.length>0){
    html+='<div class="rtitle">الأخطاء اللي لازم تتعلمها</div>';
    uniq.forEach(function(e){
      html+='<div class="rep-err-block">';
      html+='<div class="rep-err-orig">✗ "'+escHtml(e.orig)+'"</div>';
      html+='<div class="rep-err-fix">✓ "'+escHtml(e.fix)+'"</div>';
      html+='<div class="rep-err-why">'+escHtml(e.why)+'</div></div>';
    });
  }

  var uniqW=[];
  state.allWeak.forEach(function(w){if(!uniqW.find(function(u){return u.said===w.said;}))uniqW.push(w);});
  if(uniqW.length>0){
    html+='<div class="rtitle">كلمات ضعيفة — استبدلها</div>';
    uniqW.forEach(function(w){
      html+='<div class="rep-err-block" style="border-color:rgba(251,191,36,.2)">';
      html+='<div style="color:var(--amber);">⚠ "'+escHtml(w.said)+'"</div>';
      html+='<div class="rep-err-fix">→ "'+escHtml(w.better)+'"</div></div>';
    });
  }

  html+='<button class="new-btn" onclick="location.reload()">New Session</button>';
  rc.innerHTML=html;
}
